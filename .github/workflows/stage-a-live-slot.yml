name: Stage-A Live Single Slot

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Frozen provider
        required: true
        type: choice
        options: [KIMI, DEEPSEEK, MINIMAX]
      slot:
        description: Frozen slot number
        required: true
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions:
  contents: write

concurrency:
  group: stage-a-live-single-slot
  cancel-in-progress: false

jobs:
  execute-one-frozen-slot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stage-a-readiness
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen plan before credentials
        run: python tools/build_jianghe_stage_a_frozen_plan.py --check --output docs/evidence/JIANGHE_STAGE_A_FROZEN_PLAN_V0_1.json
      - name: Configure state-commit identity
        run: |
          git config user.name "Stage-A Live Lane"
          git config user.email "stage-a-live@users.noreply.github.com"
      - name: Execute one KIMI remotely reserved frozen slot
        if: inputs.provider == 'KIMI'
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: >-
          python tools/run_jianghe_stage_a_live_slot.py
          --provider "KIMI"
          --slot "${{ inputs.slot }}"
      - name: Execute one DEEPSEEK remotely reserved frozen slot
        if: inputs.provider == 'DEEPSEEK'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python tools/run_jianghe_stage_a_live_slot.py
          --provider "DEEPSEEK"
          --slot "${{ inputs.slot }}"
      - name: Execute one MINIMAX remotely reserved frozen slot
        if: inputs.provider == 'MINIMAX'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: >-
          python tools/run_jianghe_stage_a_live_slot.py
          --provider "MINIMAX"
          --slot "${{ inputs.slot }}"
