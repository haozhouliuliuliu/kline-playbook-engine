name: Stage-A V0.2 Live Slot — RETIRED

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Historical V0.2 provider selection; execution is retired
        required: true
        type: choice
        options: [KIMI, DEEPSEEK, MINIMAX]
      slot:
        description: Historical V0.2 slot; execution is retired
        required: true
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions:
  contents: read

concurrency:
  group: stage-a-v0-2-retired
  cancel-in-progress: false

jobs:
  retired-v0-2-lane:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed before credentials or provider transport
        shell: bash
        run: |
          echo "STAGE_A_V0_2_LIVE_EXECUTION=RETIRED"
          echo "OWNER_DECISION=JIANGHE_STAGE_A_V0_3_CAPABILITY_FIRST_OWNER_DECISION"
          echo "PAID_CALLS=PAUSED_UNTIL_V0_3_OFFLINE_CLOSURE"
          echo "OLD_KIMI_1=SUPERSEDED_DO_NOT_EXECUTE"
          echo "OLD_DEEPSEEK_1=HISTORICAL_DO_NOT_RERUN"
          echo "OLD_MINIMAX_1=HISTORICAL_DO_NOT_RERUN"
          exit 1
