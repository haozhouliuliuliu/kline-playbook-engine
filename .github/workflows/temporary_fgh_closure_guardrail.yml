name: temporary-fgh-closure-guardrail

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ contains(github.event.head_commit.message, '[run-fgh-closure]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Apply bounded correction and run verification
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python - <<'PY'
          from pathlib import Path

          path = Path("src/technical_features.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from pathlib import Path\nfrom typing import Iterable\n"
          new_import = "from pathlib import Path\nfrom typing import Iterable\nfrom weakref import WeakValueDictionary\n"
          if old_import not in text:
              raise SystemExit("expected import anchor not found")
          text = text.replace(old_import, new_import, 1)

          class_anchor = "\n\nclass TimeframeAggregator:\n"
          registry = (
              "\n\n# Closure guardrail: feature computation accepts only aggregation envelopes\n"
              "# actually issued by TimeframeAggregator in this process. This closes normal\n"
              "# caller laundering of incomplete evidence; OS/process tamper-proofing is not claimed.\n"
              "_ISSUED_AGGREGATION_RESULTS: WeakValueDictionary[int, AggregationResult] = WeakValueDictionary()\n"
              "\n\nclass TimeframeAggregator:\n"
          )
          if class_anchor not in text:
              raise SystemExit("TimeframeAggregator anchor not found")
          text = text.replace(class_anchor, registry, 1)

          old_return = '''        return AggregationResult._from_aggregation(\n            aggregates=tuple(aggregates),\n            incomplete_buckets=tuple(incomplete),\n            expected_bucket_identities=tuple(expected_ids),\n            exchange=exchange,\n            concrete_instrument=concrete_instrument,\n            timeframe_spec=spec,\n            session_metadata_version=self._sessions.version,\n            coverage_start=coverage_start,\n            coverage_end=coverage_end,\n        )\n'''
          new_return = '''        result = AggregationResult._from_aggregation(\n            aggregates=tuple(aggregates),\n            incomplete_buckets=tuple(incomplete),\n            expected_bucket_identities=tuple(expected_ids),\n            exchange=exchange,\n            concrete_instrument=concrete_instrument,\n            timeframe_spec=spec,\n            session_metadata_version=self._sessions.version,\n            coverage_start=coverage_start,\n            coverage_end=coverage_end,\n        )\n        _ISSUED_AGGREGATION_RESULTS[id(result)] = result\n        return result\n'''
          if old_return not in text:
              raise SystemExit("AggregationResult return anchor not found")
          text = text.replace(old_return, new_return, 1)

          old_validation = '''def _validated_feature_input(result: AggregationResult) -> tuple[AggregatedBar, ...]:\n    if not isinstance(result, AggregationResult):\n        raise ValueError("feature computation requires an AggregationResult completeness envelope")\n    if result.incomplete_buckets:\n'''
          new_validation = '''def _validated_feature_input(result: AggregationResult) -> tuple[AggregatedBar, ...]:\n    if not isinstance(result, AggregationResult):\n        raise ValueError("feature computation requires an AggregationResult completeness envelope")\n    if _ISSUED_AGGREGATION_RESULTS.get(id(result)) is not result:\n        raise ValueError("feature computation requires an aggregator-issued AggregationResult")\n    if result.incomplete_buckets:\n'''
          if old_validation not in text:
              raise SystemExit("feature validation anchor not found")
          text = text.replace(old_validation, new_validation, 1)
          path.write_text(text, encoding="utf-8")

          Path("tests/test_fgh_closure_guardrails.py").write_text(r'''import unittest

from src.technical_features import AggregationResult, compute_ema
from tests.test_technical_features import TEST_ONLY_NUMERIC_POLICY, aggregate, complete_minute_bars


class FGHClosureGuardrailTests(unittest.TestCase):
    def test_manual_clean_envelope_cannot_launder_incomplete_bucket_evidence(self):
        incomplete = aggregate(complete_minute_bars()[:-1])
        self.assertTrue(incomplete.incomplete_buckets)
        forged = AggregationResult._from_aggregation(
            aggregates=incomplete.aggregates,
            incomplete_buckets=(),
            expected_bucket_identities=tuple(item.bucket_identity for item in incomplete.aggregates),
            exchange=incomplete.exchange,
            concrete_instrument=incomplete.concrete_instrument,
            timeframe_spec=incomplete.timeframe_spec,
            session_metadata_version=incomplete.session_metadata_version,
            coverage_start=incomplete.coverage_start,
            coverage_end=incomplete.coverage_end,
        )
        with self.assertRaisesRegex(ValueError, "aggregator-issued"):
            compute_ema(
                forged,
                period=2,
                price_field="close",
                numeric_policy=TEST_ONLY_NUMERIC_POLICY,
                feature_version="closure-guard-ema-v1",
            )

    def test_real_aggregator_issued_complete_envelope_still_computes(self):
        issued = aggregate(complete_minute_bars())
        values = compute_ema(
            issued,
            period=2,
            price_field="close",
            numeric_policy=TEST_ONLY_NUMERIC_POLICY,
            feature_version="closure-guard-ema-v1",
        )
        self.assertTrue(values)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          Path("docs/evidence/FGH_CLOSURE_GUARDRAILS_V0_1.md").write_text('''# FGH_CLOSURE_GUARDRAILS_V0_1\n\n> Date: 2026-08-20\n> Status: ENGINEERING_CORRECTION\n\nRetrospective 1 found that callers could directly use `AggregationResult._from_aggregation()` to discard incomplete-bucket evidence. Feature computation now accepts only an `AggregationResult` object actually issued by `TimeframeAggregator.aggregate()` in the current process.\n\n```text\nNORMAL_CALLER_COMPLETENESS_LAUNDERING=CLOSED\nOS_PROCESS_TAMPER_PROOFING=NOT_CLAIMED\nLOCAL_PRIVATE_STATE_TAMPER_PROOFING=NOT_CLAIMED\nCANDIDATE_OUTCOME_DATA_USED=NO\n```\n''', encoding="utf-8")
          PY

            python -m unittest tests.test_technical_features tests.test_fgh_closure_guardrails tests.test_fgh_combined_causal_integration tests.test_stop_order_execution -v
            python -m unittest discover -s tests -v
            python -m compileall -q src tools tests
            git diff --check
          } 2>&1 | tee /tmp/fgh_closure.log

      - name: Commit verified correction or diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          git config user.name "kline-playbook-engine closure bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${VERIFY_OUTCOME}" = "success" ]; then
            rm -f docs/reviews/TEMP_CLOSURE_RUN_DIAGNOSTIC.md
            git add src/technical_features.py tests/test_fgh_closure_guardrails.py docs/evidence/FGH_CLOSURE_GUARDRAILS_V0_1.md
            git commit -m "repair(FGH): seal aggregation completeness envelope [closure-bot]"
          else
            git restore src/technical_features.py || true
            rm -f tests/test_fgh_closure_guardrails.py docs/evidence/FGH_CLOSURE_GUARDRAILS_V0_1.md
            mkdir -p docs/reviews
            {
              echo "# TEMP_CLOSURE_RUN_DIAGNOSTIC"
              echo
              echo "VERIFY_OUTCOME=${VERIFY_OUTCOME}"
              echo
              echo '```text'
              tail -n 160 /tmp/fgh_closure.log
              echo '```'
            } > docs/reviews/TEMP_CLOSURE_RUN_DIAGNOSTIC.md
            git add docs/reviews/TEMP_CLOSURE_RUN_DIAGNOSTIC.md
            git commit -m "test(closure): record FGH guardrail diagnostic [closure-bot]"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
