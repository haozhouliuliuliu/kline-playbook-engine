name: Jianghe Final-Chance V0.2 Live Slot

# Single explicit paid slot per run. Triggered only by a push to `main` that
# changes the execution-request file. The integration/execution lane writes
# exactly one frozen slot_identity into that file per run; this workflow never
# batches, never retries, never advances to the next slot, never falls back to
# another provider/model, and never modifies the payload or case.
#
# Secret policy: provider API keys are read only from the GitHub environment
# `stage-a-readiness` into job env vars. The workflow only ever prints
# PRESENT/MISSING for them and never prints a secret value; no secret value is
# written into logs, artifacts, commits, or evidence.
on:
  push:
    branches: [main]
    paths:
      - docs/evidence/JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXECUTION_REQUEST_V0_2.json

permissions:
  contents: write

concurrency:
  group: jianghe-final-chance-v0-2-single-slot
  cancel-in-progress: false

jobs:
  final-chance-slot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stage-a-readiness
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Stage-A API credentials present (values never printed)
        shell: bash
        run: |
          for v in DEEPSEEK_API_KEY MINIMAX_API_KEY MOONSHOT_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::credential $v is MISSING; fail closed before any provider call"
              exit 1
            fi
            echo "credential_check::$v=PRESENT"
          done

      - name: Read and validate frozen execution request
        id: request
        shell: bash
        run: |
          REQUEST_FILE="docs/evidence/JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXECUTION_REQUEST_V0_2.json"
          if [ ! -f "$REQUEST_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "NO_REQUEST_FILE: execution-request absent; workflow is a no-op"
            exit 0
          fi
          REQUEST_FILE="$REQUEST_FILE" python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          path = Path(os.environ['REQUEST_FILE'])
          req = json.loads(path.read_text(encoding='utf-8'))
          if req.get('schema_version') != 'JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXECUTION_REQUEST_V0_2':
              sys.exit('execution request schema_version mismatch')
          if req.get('automatic_retry') != 'FORBIDDEN':
              sys.exit('automatic_retry must be FORBIDDEN')
          if req.get('automatic_next_slot') != 'FORBIDDEN':
              sys.exit('automatic_next_slot must be FORBIDDEN')
          slot = req.get('slot_identity', '')
          m = re.fullmatch(r'DKL_FC_V0_2:(DEEPSEEK|MINIMAX|KIMI):(DKL-FC-00[1-4])', slot)
          if m is None:
              sys.exit('invalid slot_identity %r; must be one of the frozen 12 slots' % (slot,))
          provider, sample = m.group(1), m.group(2)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('skip=false\n')
              f.write('request_slot=%s\n' % slot)
              f.write('provider=%s\n' % provider)
              f.write('sample=%s\n' % sample)
          print('REQUEST_VALID slot=%s provider=%s sample=%s' % (slot, provider, sample))
          PY

      - name: Pre-send review check (offline, must PASS)
        if: steps.request.outputs.skip != 'true'
        run: python tools/build_jianghe_downloaded_kline_final_chance_presend_v0_2.py --check

      - name: Freeze explicit slot authority
        if: steps.request.outputs.skip != 'true'
        run: python tools/build_jianghe_downloaded_kline_final_chance_presend_v0_2.py --freeze-slot "${{ steps.request.outputs.request_slot }}"

      - name: Commit slot authority to main (must reach GitHub main before network)
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Jianghe Final-Chance Lane"
          git config user.email "final-chance-lane@users.noreply.github.com"
          git add docs/evidence/JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXPLICIT_SLOT_V0_2.json
          git diff --cached --check
          git commit -m "Jianghe: freeze final-chance slot ${{ steps.request.outputs.request_slot }}"
          git fetch origin main
          git push origin HEAD:main

      - name: Dry-run preflight (must PASS, no network)
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          python tools/run_jianghe_downloaded_kline_final_chance_slot_v0_2.py \
            --provider "${{ steps.request.outputs.provider }}" \
            --sample-id "${{ steps.request.outputs.sample }}" \
            --dry-run

      - name: Execute live slot exactly once (outcome captured, no retry)
        id: live
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p .runtime/final-chance-v0-2
          set +e
          python tools/run_jianghe_downloaded_kline_final_chance_slot_v0_2.py \
            --provider "${{ steps.request.outputs.provider }}" \
            --sample-id "${{ steps.request.outputs.sample }}" > .runtime/final-chance-v0-2/slot-result.json 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "live_exit_code=$code"
          cat .runtime/final-chance-v0-2/slot-result.json
          exit 0

      - name: Verify remote final-chance ledger for this slot
        id: verify
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p .runtime/final-chance-v0-2
          REQUEST_SLOT="${{ steps.request.outputs.request_slot }}" python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.')
          from src.jianghe_final_chance_live_lane import (
              FINAL_CHANCE_REMOTE_REF,
              FinalChanceGitRemoteLedgerStore,
              load_verified_final_chance_plan,
              committed_plan_file_sha256,
          )

          slot = os.environ['REQUEST_SLOT']
          plan = load_verified_final_chance_plan()
          plan_sha = committed_plan_file_sha256()
          store = FinalChanceGitRemoteLedgerStore(repository='.', remote_ref=FINAL_CHANCE_REMOTE_REF)
          observed = store.load(str(plan['pilot_plan_identity']), plan_sha)
          events = [e for e in observed.ledger.events if e['slot_identity'] == slot]
          starts = [e for e in events if e['event_type'] == 'NETWORK_ATTEMPT_STARTED']
          terminals = [e for e in events if e['event_type'] == 'ATTEMPT_TERMINAL']
          if len(starts) != 1:
              sys.exit('expected exactly 1 NETWORK_ATTEMPT_STARTED for %s; got %d' % (slot, len(starts)))
          if len(terminals) != 1:
              sys.exit('expected exactly 1 ATTEMPT_TERMINAL for %s; got %d' % (slot, len(terminals)))
          t = terminals[0]
          summary = {
              'request_slot': slot,
              'provider_id': t['provider_id'],
              'sample_id': t['slot_identity'].split(':')[-1],
              'status': t['status'],
              'accounted_cny': t['accounted_cny'],
              'evidence_identity': t['evidence_identity'],
              'request_identity': t['request_identity'],
              'start_event_identity': starts[0]['event_identity'],
              'terminal_event_identity': t['event_identity'],
              'remote_ledger_head': observed.head_sha,
              'automatic_retries': 0,
              'automatic_next_slots': 0,
              'credential_value_exposed': False,
          }
          with open('.runtime/final-chance-v0-2/run-summary.json', 'w', encoding='utf-8') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2, sort_keys=True)
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Close consumed explicit slot authority
        if: always()
        shell: bash
        run: |
          if [ -f docs/evidence/JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXPLICIT_SLOT_V0_2.json ]; then
            git config user.name "Jianghe Final-Chance Lane"
            git config user.email "final-chance-lane@users.noreply.github.com"
            git rm docs/evidence/JIANGHE_DOWNLOADED_KLINE_FINAL_CHANCE_EXPLICIT_SLOT_V0_2.json
            git commit -m "Jianghe: close consumed final-chance slot ${{ steps.request.outputs.request_slot }}"
            git fetch origin main
            git push origin HEAD:main
          else
            echo "no explicit slot authority present; nothing to close"
          fi

      - name: Fail closed on non-capability terminal
        if: always() && steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          code="${{ steps.live.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::final-chance slot ended non-capability (exit_code=$code); round must stop"
            exit 1
          fi
          echo "capability terminal confirmed for ${{ steps.request.outputs.request_slot }}"

      - name: Upload sanitized slot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jianghe-final-chance-v0-2-slot
          path: .runtime/final-chance-v0-2/*.json
          if-no-files-found: warn
          retention-days: 30
