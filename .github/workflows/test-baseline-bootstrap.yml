name: test-baseline-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  baseline-repair-materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair/test-baseline-current-v03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic baseline sync
        run: python tools/_apply_test_baseline_current_v03.py
      - name: Diff hygiene before tests
        run: git diff --check
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Materialize only green baseline repair
        run: |
          rm tools/_apply_test_baseline_current_v03.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: synchronize deterministic authority baseline"
          git push origin HEAD:repair/test-baseline-current-v03
