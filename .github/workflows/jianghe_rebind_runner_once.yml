name: Jianghe rebind runner once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jianghe_rebind_runner_once.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/jianghe-active-identity-rebind-v01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild Jianghe knowledge-pack and SOURCE_ONLY evidence
        run: |
          python tools/build_jianghe_knowledge_pack_v0_1.py
          python tools/build_jianghe_source_only_verification_v0_1.py

      - name: Verify builder output identity and binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = 'e079c225825e08d5ccca07feddd9a6dbc1a6e07189d033fb1929b0c689e90fd2'
          foundation = json.loads(Path('docs/evidence/JIANGHE_AI_TRADER_FOUNDATION_V0_1.json').read_text(encoding='utf-8'))
          verification = json.loads(Path('docs/evidence/JIANGHE_V1_1_SOURCE_ONLY_VERIFICATION_V0_1.json').read_text(encoding='utf-8'))
          actual = foundation['knowledge_pack_identity']
          print('BUILDER_KNOWLEDGE_PACK_IDENTITY=' + actual)
          print('BUILDER_SOURCE_ONLY_VERIFIED=' + verification['source_only_verified'])
          print('BUILDER_SOURCE_BUNDLE_IDENTITY=' + verification['session']['source_bundle_identity'])
          print('BUILDER_SOURCE_BUNDLE_HASH=' + verification['session']['source_bundle_hash'])
          print('BUILDER_SESSION_IDENTITY=' + verification['session']['session_identity'])
          if actual != expected:
              raise SystemExit(f'builder identity mismatch: expected {expected}, actual {actual}')
          if verification['knowledge_pack']['knowledge_pack_identity'] != actual:
              raise SystemExit('SOURCE_ONLY verification did not bind rebuilt knowledge pack')
          PY

      - name: Targeted SOURCE_ONLY technical-denial tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_jianghe_source_only_verification -v 2>&1 | tee /tmp/targeted.log

      - name: Research-firewall regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_research_firewall -v 2>&1 | tee /tmp/firewall.log

      - name: Canonical full suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/full.log

      - name: Write execution evidence
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          foundation = json.loads(Path('docs/evidence/JIANGHE_AI_TRADER_FOUNDATION_V0_1.json').read_text(encoding='utf-8'))
          verification = json.loads(Path('docs/evidence/JIANGHE_V1_1_SOURCE_ONLY_VERIFICATION_V0_1.json').read_text(encoding='utf-8'))
          def ran(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace')
              matches = re.findall(r'Ran (\d+) tests? in ([^\n]+)', text)
              return matches[-1][0] if matches else 'UNKNOWN'
          body = f'''# Jianghe Authority-Hygiene Identity Rebind Execution V0.1

```text
STATUS=PASS
RUNNER_SOURCE_MAIN_SHA={os.environ.get('GITHUB_SHA','UNKNOWN')}
GITHUB_RUN_ID={os.environ.get('GITHUB_RUN_ID','UNKNOWN')}
BUILDER_KNOWLEDGE_PACK_IDENTITY={foundation['knowledge_pack_identity']}
SOURCE_ONLY_VERIFIED={verification['source_only_verified']}
SOURCE_MATERIAL_MANIFEST_IDENTITY={verification['source_material_manifest']['manifest_identity']}
SOURCE_BUNDLE_IDENTITY={verification['session']['source_bundle_identity']}
SOURCE_BUNDLE_HASH={verification['session']['source_bundle_hash']}
SOURCE_ONLY_SESSION_IDENTITY={verification['session']['session_identity']}
CLAIM_MANIFEST_IDENTITY={verification['claim_manifest']['manifest_identity']}
CLAIM_RECORD_COUNT={verification['claim_manifest']['claim_record_count']}
CASE_MANIFEST_IDENTITY={verification['case_manifest']['manifest_identity']}
CASE_RECORD_COUNT={verification['case_manifest']['case_record_count']}
TARGETED_SOURCE_ONLY_TESTS={ran('/tmp/targeted.log')}_PASS
RESEARCH_FIREWALL_TESTS={ran('/tmp/firewall.log')}_PASS
CANONICAL_FULL_SUITE={ran('/tmp/full.log')}_PASS
CANDIDATE_OUTCOME_BACKTEST=NOT_AUTHORIZED
VALIDATION_ACCESS=LOCKED
FINAL_ACCESS=LOCKED
```

## Technical-denial evidence

'''
          for item in verification['technical_denials']:
              body += f"- `{item['requested_surface']}` -> `{item['outcome']}` / `{item['reason']}` / opened_artifact=`{item['opened_artifact']}`\n"
          body += '''

This is execution evidence from the repository's existing builders and tests. It does not change Jianghe source semantics, promote PRIMARY, authorize candidate outcomes, adopt a model/provider, or unlock Validation/Final/Shadow/Broker/real-money access.
'''
          Path('docs/evidence/JIANGHE_AUTHORITY_HYGIENE_IDENTITY_REBIND_EXECUTION_V0_1.md').write_text(body, encoding='utf-8')
          PY

      - name: Commit successful builder outputs to repair branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evidence/JIANGHE_AI_TRADER_FOUNDATION_V0_1.json \
                  docs/evidence/JIANGHE_V1_1_SOURCE_ONLY_VERIFICATION_V0_1.json \
                  docs/evidence/JIANGHE_AUTHORITY_HYGIENE_IDENTITY_REBIND_EXECUTION_V0_1.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'evidence: rebuild Jianghe active identity and SOURCE_ONLY binding [rebind-ci]'
            git push origin HEAD:repair/jianghe-active-identity-rebind-v01
          fi
