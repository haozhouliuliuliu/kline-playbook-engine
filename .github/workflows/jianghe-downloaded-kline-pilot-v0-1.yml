name: Jianghe Downloaded-Kline DeepSeek Pilot V0.1

on:
  workflow_dispatch:
    inputs:
      sample_id:
        description: Frozen downloaded-Kline sample
        required: true
        type: choice
        options: [DKL-DS-001, DKL-DS-002, DKL-DS-003, DKL-DS-004, DKL-DS-005]

permissions:
  contents: write

concurrency:
  group: jianghe-downloaded-kline-pilot-v0-1
  cancel-in-progress: false

jobs:
  one-sample:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stage-a-readiness
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify frozen pilot plan before credentials
        run: python tools/build_jianghe_downloaded_kline_pilot_plan_v0_1.py --check
      - name: Execute exactly one frozen DeepSeek sample
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tools/run_jianghe_downloaded_kline_pilot.py --sample-id "${{ inputs.sample_id }}"
      - name: Upload safe diagnostics if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-kline-${{ inputs.sample_id }}
          path: .runtime/jianghe_downloaded_kline/**/*.json
          if-no-files-found: ignore
          retention-days: 30
