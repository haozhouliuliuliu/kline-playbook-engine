name: Apply bounded PAPER wake durability repair

on:
  push:
    branches:
      - codex/paper-total-audit-repair-v01-20260828

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded repair
        run: python tools/_apply_paper_wake_durability_fix.py
      - name: Focused verification
        run: |
          python -m compileall -q src tools tests
          python -m unittest tests.test_paper_wake_durability_ordering -v
          python -m unittest tests.test_paper_final_closure -v
          python tools/check_authority_consistency.py
          git diff --check
      - name: Commit verified repair
        run: |
          rm .github/workflows/apply-paper-wake-durability-fix.yml
          rm tools/_apply_paper_wake_durability_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'paper: close wake durability ordering gap'
          git push origin HEAD:codex/paper-total-audit-repair-v01-20260828
