name: prespend-v02-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prespend-v02-bootstrap.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover-staged-repair:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e638e02d1580b1849546693a8df89ac72570c48d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact staged repairs
        run: |
          set -euo pipefail
          python tools/_apply_prespend_missing_fixes_v03.py
          python tools/_apply_prespend_final_fixes_v04.py
          python tools/_apply_prespend_final_fixes_v05.py
      - name: Compile repaired surfaces
        run: |
          python -m py_compile \
            src/jianghe_prespend_runtime.py \
            src/jianghe_response_normalizer.py \
            src/jianghe_model_provider.py \
            src/intent.py \
            src/shadow_runtime.py \
            tests/test_jianghe_prespend_repair.py \
            tests/test_jianghe_response_normalizer.py \
            tests/test_jianghe_model_provider.py \
            tests/test_prespend_missing_repairs.py
      - name: Focused and adversarial repair regression
        run: |
          python -m unittest \
            tests.test_jianghe_prespend_repair \
            tests.test_jianghe_response_normalizer \
            tests.test_prespend_missing_repairs \
            tests.test_jianghe_fidelity_evaluation \
            tests.test_jianghe_model_provider \
            tests.test_shadow_runtime_foundation -v
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Diff hygiene
        run: git diff --check
      - name: Materialize verified repair to PR branch
        run: |
          set -euo pipefail
          rm -f tools/_apply_prespend_missing_fixes_v03.py
          rm -f tools/_apply_prespend_final_fixes_v04.py
          rm -f tools/_apply_prespend_final_fixes_v05.py
          rm -f .github/workflows/prespend-batched-domestic-v02.yml
          rm -f docs/reviews/PRESPEND_BATCHED_DOMESTIC_V02_CI_DIAGNOSTIC.tmp.md
          rm -f docs/reviews/PRESPEND_V02_TRIGGER.tmp
          rm -f docs/reviews/PRESPEND_V05_RETRIGGER.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "repair: materialize verified frozen prespend fixes"
          git push origin HEAD:repair/prespend-batched-domestic-v02

  prespend-v02-final-verification:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/prespend-batched-domestic-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply staged frozen-finding repairs
        run: |
          set -euo pipefail
          if [ -f tools/_apply_prespend_missing_fixes_v03.py ]; then
            python tools/_apply_prespend_missing_fixes_v03.py
          fi
          if [ -f tools/_apply_prespend_final_fixes_v04.py ]; then
            python tools/_apply_prespend_final_fixes_v04.py
          fi
          if [ -f tools/_apply_prespend_final_fixes_v05.py ]; then
            python tools/_apply_prespend_final_fixes_v05.py
          fi
      - name: Compile repaired surfaces
        run: |
          python -m py_compile \
            src/jianghe_prespend_runtime.py \
            src/jianghe_response_normalizer.py \
            src/jianghe_model_provider.py \
            src/intent.py \
            src/shadow_runtime.py \
            tests/test_jianghe_prespend_repair.py \
            tests/test_jianghe_response_normalizer.py \
            tests/test_jianghe_model_provider.py \
            tests/test_prespend_missing_repairs.py
      - name: Focused and adversarial repair regression
        run: |
          python -m unittest \
            tests.test_jianghe_prespend_repair \
            tests.test_jianghe_response_normalizer \
            tests.test_prespend_missing_repairs \
            tests.test_jianghe_fidelity_evaluation \
            tests.test_jianghe_model_provider \
            tests.test_shadow_runtime_foundation -v
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Diff hygiene
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Materialize verified repair on PR branch
        run: |
          set -euo pipefail
          if [ ! -f tools/_apply_prespend_final_fixes_v05.py ]; then
            exit 0
          fi
          rm -f tools/_apply_prespend_missing_fixes_v03.py
          rm -f tools/_apply_prespend_final_fixes_v04.py
          rm -f tools/_apply_prespend_final_fixes_v05.py
          rm -f .github/workflows/prespend-batched-domestic-v02.yml
          rm -f docs/reviews/PRESPEND_BATCHED_DOMESTIC_V02_CI_DIAGNOSTIC.tmp.md
          rm -f docs/reviews/PRESPEND_V02_TRIGGER.tmp
          rm -f docs/reviews/PRESPEND_V05_RETRIGGER.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "repair: close frozen prespend implementation gaps"
          git push origin HEAD:repair/prespend-batched-domestic-v02
