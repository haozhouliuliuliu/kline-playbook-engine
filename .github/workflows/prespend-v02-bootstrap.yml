name: prespend-v02-bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prespend-v02-final-verification:
    if: github.head_ref == 'repair/prespend-batched-domestic-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize missing frozen-finding repairs when staged
        run: |
          if [ -f tools/_apply_prespend_missing_fixes_v03.py ]; then
            python tools/_apply_prespend_missing_fixes_v03.py
          fi
      - name: Compile repaired surfaces
        run: |
          python -m py_compile \
            src/jianghe_prespend_runtime.py \
            src/jianghe_response_normalizer.py \
            src/intent.py \
            src/shadow_runtime.py \
            tests/test_jianghe_prespend_repair.py \
            tests/test_jianghe_response_normalizer.py \
            tests/test_prespend_missing_repairs.py
      - name: Focused and adversarial repair regression
        run: |
          python -m unittest \
            tests.test_jianghe_prespend_repair \
            tests.test_jianghe_response_normalizer \
            tests.test_prespend_missing_repairs \
            tests.test_jianghe_fidelity_evaluation \
            tests.test_shadow_runtime_foundation -v
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Diff hygiene
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Materialize verified repair on PR branch
        run: |
          if [ ! -f tools/_apply_prespend_missing_fixes_v03.py ]; then
            exit 0
          fi
          rm -f tools/_apply_prespend_missing_fixes_v03.py
          rm -f .github/workflows/prespend-batched-domestic-v02.yml
          rm -f docs/reviews/PRESPEND_BATCHED_DOMESTIC_V02_CI_DIAGNOSTIC.tmp.md
          rm -f docs/reviews/PRESPEND_V02_TRIGGER.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "repair: close missing BSP003 RSP001 RSP002 implementation gaps"
          git push origin HEAD:repair/prespend-batched-domestic-v02
