name: Stage-A Offline CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOONSHOT_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      MINIMAX_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Stage-A focused tests
        run: python -m unittest tests.test_jianghe_stage_a_runtime -v
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
