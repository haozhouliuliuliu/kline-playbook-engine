name: prespend-repair-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-test-and-materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair/prespend-batched-domestic-v01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact frozen-finding patches
        run: |
          python tools/_apply_prespend_repair_v01.py
          python tools/_apply_provider_prespend_v01.py
      - name: Compile changed Python
        run: python -m py_compile src/jianghe_prespend_runtime.py src/intent.py src/shadow_runtime.py src/jianghe_response_normalizer.py tests/test_jianghe_prespend_repair.py tests/test_jianghe_response_normalizer.py
      - name: Focused and adversarial regression
        run: python -m unittest tests.test_jianghe_prespend_repair tests.test_jianghe_response_normalizer tests.test_shadow_runtime_foundation -v
      - name: Canonical full suite
        run: python -m unittest discover -s tests -v
      - name: Materialize only green repair
        run: |
          rm tools/_apply_prespend_repair_v01.py
          rm tools/_apply_provider_prespend_v01.py
          rm -f .github/workflows/prespend-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "repair: close frozen prespend implementation defects"
          git push origin HEAD:repair/prespend-batched-domestic-v01
